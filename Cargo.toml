[workspace]
members = ["crates/sweeper-core", "crates/sweeper-app", "crates/sweeper-helper"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
thiserror = "2"
rayon = "1"
tempfile = "3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError", "NSArray", "NSObject", "NSEnumerator"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication", "NSResponder", "libc"] }
